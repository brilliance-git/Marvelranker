name: Deploy to GitHub Pages

on:
  push:
    # This repo's actual default branch is claude/marvel-movie-ranking-zki0hg
    # (not main) — GitHub Pages' auto-created "github-pages" environment
    # only allows deploys from the default branch, so a push to any other
    # branch, including main, is rejected before the job even starts.
    branches: [claude/marvel-movie-ranking-zki0hg]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
