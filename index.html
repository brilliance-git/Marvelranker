<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Marvel Movie Ranker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1>Marvel Movie Ranker</h1>
    <p class="subtitle">Swipe or tap the arrows to browse. Tap a quartile button to place the movie — they're always on screen, no scrolling needed.</p>
  </header>

  <section class="ranker-panel" id="ranker-panel">
    <div class="ranker-top">
      <input id="search-input" type="text" placeholder="Search movies..." autocomplete="off">
      <div class="ranker-status-row">
        <span id="ranker-status" class="ranker-status"></span>
        <button type="button" id="ranker-cancel" class="ranker-cancel-btn" hidden>Cancel</button>
      </div>
    </div>

    <div class="ranker-stage">
      <button type="button" class="ranker-nav ranker-prev" id="ranker-prev" aria-label="Previous movie">‹</button>
      <div class="ranker-card-viewport">
        <div class="ranker-card" id="ranker-card">
          <div class="ranker-card-phase" id="ranker-card-phase"></div>
          <div class="ranker-card-title" id="ranker-card-title"></div>
          <div class="ranker-card-year" id="ranker-card-year"></div>
        </div>
      </div>
      <button type="button" class="ranker-nav ranker-next" id="ranker-next" aria-label="Next movie">›</button>
    </div>

    <div class="quartile-buttons" id="quartile-buttons"></div>
  </section>

  <main class="layout">
    <section class="board-wrap">
      <div class="board-header-row">
        <div id="progress-summary" class="progress-summary"></div>
        <div class="board-actions">
          <button id="reset-btn" class="secondary-btn">Reset board</button>
          <button id="export-btn" class="secondary-btn">Export PNG</button>
        </div>
      </div>
      <div id="tier-board" class="tier-board"></div>
    </section>
  </main>

  <footer class="app-footer">
    <span id="status-text"></span>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="movies.js"></script>
  <script src="app.js"></script>
</body>
</html>
