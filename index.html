<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Marvel Movie Ranker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1>Marvel Movie Ranker</h1>
    <p class="subtitle">Tap a movie below, then tap a quartile to place it — the buttons stay on screen. Inside a quartile, drag a movie up or down to set its exact rank.</p>
  </header>

  <section class="control-panel" id="control-panel">
    <input id="search-input" type="text" placeholder="Search movies..." autocomplete="off">
    <div class="selection-row">
      <span id="selection-status" class="selection-status"></span>
      <button type="button" id="selection-cancel" class="selection-cancel-btn" hidden>Cancel</button>
    </div>
    <div class="quartile-buttons" id="quartile-buttons"></div>
  </section>

  <main class="layout">
    <aside class="pool-panel">
      <div id="movie-pool" class="movie-pool"></div>
    </aside>

    <section class="board-wrap">
      <div class="board-header-row">
        <div id="progress-summary" class="progress-summary"></div>
        <div class="board-actions">
          <button id="reset-btn" class="secondary-btn">Reset board</button>
          <button id="export-btn" class="secondary-btn">Export PNG</button>
        </div>
      </div>
      <div id="tier-board" class="tier-board"></div>
    </section>
  </main>

  <footer class="app-footer">
    <span id="status-text"></span>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="movies.js"></script>
  <script src="app.js"></script>
</body>
</html>
